<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Surah Ordering Game</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;600;700&family=Marcellus&display=swap">
<style>
/* Layout: a single narrow column like a mushaf index; one sortable list, sticky action bar at the bottom */
:root {
  --bg: #f3f1ea;
  --surface: #fffdf7;
  --ink: #1f2a26;
  --muted: #5f6b65;
  --line: #ddd8c8;
  --accent: #1e6b57;
  --accent-ink: #ffffff;
  --gold: #a87b2a;
  --warn: #b0482e;
  --shadow: 0 10px 30px rgba(31, 42, 38, .18);
  --f-display: "Marcellus", "Iowan Old Style", Georgia, serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-arabic: "Amiri", "Traditional Arabic", "Geeza Pro", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121816; --surface: #1b2320; --ink: #ece8dc; --muted: #9aa59f; --line: #2e3a35;
    --accent: #4fb293; --accent-ink: #0d1412; --gold: #d6aa58; --warn: #e07a5f;
    --shadow: 0 10px 30px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121816; --surface: #1b2320; --ink: #ece8dc; --muted: #9aa59f; --line: #2e3a35;
  --accent: #4fb293; --accent-ink: #0d1412; --gold: #d6aa58; --warn: #e07a5f;
  --shadow: 0 10px 30px rgba(0, 0, 0, .5); color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 18px 24px; display: flex; flex-direction: column; gap: 14px; }

header { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
.head-text { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.subtitle { margin: 0; font-family: var(--f-display); font-size: clamp(18px, 2.4vw, 22px); color: var(--gold); }
.subtitle .ar { font-family: var(--f-arabic); color: var(--accent); margin-inline-start: 8px; }
.eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(26px, 4vw, 34px); line-height: 1.1; margin: 0; text-wrap: balance; }
h1 .ar { font-family: var(--f-arabic); color: var(--accent); font-size: .85em; margin-inline-start: 8px; }
.intro { margin: 0; color: var(--muted); max-width: 70ch; font-size: 14px; }
.controls { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }

.stats { display: flex; gap: 14px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; margin-inline-end: 6px; }
.stats b { color: var(--ink); font-weight: 600; }

ol#list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 8px; }
.item {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  text-align: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 8px 8px;
  min-height: 72px;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  transition: border-color .15s, background .15s;
}
.item:hover { border-color: var(--accent); }
.item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.slot { position: absolute; top: 5px; left: 8px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.name { font-weight: 600; font-size: 13px; line-height: 1.2; min-width: 0; overflow-wrap: anywhere; }
.ar-name { font-family: var(--f-arabic); font-size: 21px; line-height: 1.2; color: var(--accent); direction: rtl; }
.item.ghost { opacity: .35; }
.item.chosen { cursor: grabbing; border-color: var(--accent); box-shadow: var(--shadow); }
.item.solved { border-color: var(--accent); }
.item.wrong { border: 2px solid var(--warn); background: color-mix(in srgb, var(--warn) 12%, var(--surface)); }
.item.wrong .slot { color: var(--warn); font-weight: 700; }
.item .num { display: none; }
.solved-mode .item .num { display: inline; color: var(--gold); font-weight: 600; margin-inline-end: 6px; font-variant-numeric: tabular-nums; }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-top: 1px solid var(--line);
  padding-top: 12px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-inner { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; }
button { font: inherit; cursor: pointer; border-radius: 10px; padding: 12px 18px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { padding: 10px 16px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
button.primary:hover { filter: brightness(1.06); }

.overlay { position: fixed; inset: 0; background: rgba(10, 16, 14, .55); display: grid; place-items: center; padding: 20px; z-index: 50; }
.modal {
  background: var(--surface); color: var(--ink); border-radius: 16px; box-shadow: var(--shadow);
  max-width: 380px; width: 100%; padding: 28px 24px 22px; display: flex; flex-direction: column; gap: 12px; text-align: center;
  animation: pop .22s ease-out;
}
.modal .big { font-family: var(--f-arabic); font-size: 34px; line-height: 1.2; }
.modal h2 { font-family: var(--f-display); font-weight: 400; font-size: 26px; margin: 0; text-wrap: balance; }
.modal p { margin: 0; color: var(--muted); }
.modal.win .big { color: var(--accent); }
.modal.lose .big { color: var(--warn); }
.modal .actions { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.modal .actions button { flex: 1 1 auto; }
@keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .modal { animation: none; } .item { transition: none; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="head-text">
      <h1>Surah Ordering Game</h1>
      <p class="subtitle">Juz Amma <span class="ar" lang="ar">جزء عمّ</span></p>
      <p class="intro">Drag the shuffled surahs into their Quran order. Read left to right, row by row: An-Naba goes in box 1 and An-Nas in box 37.</p>
    </div>
    <div class="controls">
      <div class="stats"><span>Attempts: <b id="attempts">0</b></span><span>Time: <b id="timer">0:00</b></span></div>
      <button id="shuffle" type="button">Shuffle</button>
      <button id="check" class="primary" type="button">Check order</button>
    </div>
  </header>

  <ol id="list" aria-label="Surahs to arrange"></ol>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="big" id="mBig"></div>
    <h2 id="mTitle"></h2>
    <p id="mText"></p>
    <div class="actions" id="mActions"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
const SURAHS = [
  [78, "An-Naba", "النبأ"], [79, "An-Nazi'at", "النازعات"], [80, "'Abasa", "عبس"],
  [81, "At-Takwir", "التكوير"], [82, "Al-Infitar", "الانفطار"], [83, "Al-Mutaffifin", "المطففين"],
  [84, "Al-Inshiqaq", "الانشقاق"], [85, "Al-Buruj", "البروج"], [86, "At-Tariq", "الطارق"],
  [87, "Al-A'la", "الأعلى"], [88, "Al-Ghashiyah", "الغاشية"], [89, "Al-Fajr", "الفجر"],
  [90, "Al-Balad", "البلد"], [91, "Ash-Shams", "الشمس"], [92, "Al-Layl", "الليل"],
  [93, "Ad-Duha", "الضحى"], [94, "Ash-Sharh", "الشرح"], [95, "At-Tin", "التين"],
  [96, "Al-'Alaq", "العلق"], [97, "Al-Qadr", "القدر"], [98, "Al-Bayyinah", "البينة"],
  [99, "Az-Zalzalah", "الزلزلة"], [100, "Al-'Adiyat", "العاديات"], [101, "Al-Qari'ah", "القارعة"],
  [102, "At-Takathur", "التكاثر"], [103, "Al-'Asr", "العصر"], [104, "Al-Humazah", "الهمزة"],
  [105, "Al-Fil", "الفيل"], [106, "Quraysh", "قريش"], [107, "Al-Ma'un", "الماعون"],
  [108, "Al-Kawthar", "الكوثر"], [109, "Al-Kafirun", "الكافرون"], [110, "An-Nasr", "النصر"],
  [111, "Al-Masad", "المسد"], [112, "Al-Ikhlas", "الإخلاص"], [113, "Al-Falaq", "الفلق"],
  [114, "An-Nas", "الناس"]
];

const list = document.getElementById("list");
const attemptsEl = document.getElementById("attempts");
const timerEl = document.getElementById("timer");
let attempts = 0, startTime = null, tick = null, solved = false;

const grip = '<svg class="grip" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';

function shuffled(arr) {
  const a = arr.slice();
  do {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
  } while (a.every((s, i) => s[0] === arr[i][0]));
  return a;
}

function render(order) {
  list.innerHTML = "";
  order.forEach(([n, en, ar]) => {
    const li = document.createElement("li");
    li.className = "item";
    li.dataset.n = n;
    li.tabIndex = 0;
    li.innerHTML = `<span class="slot"></span><span class="name"><span class="num">${n}.</span>${en}</span><span class="ar-name" lang="ar">${ar}</span>`;
    list.appendChild(li);
  });
  renumber();
}

function showMistakes() {
  [...list.children].forEach((li, i) => li.classList.toggle("wrong", +li.dataset.n !== 78 + i));
}
function clearMistakes() {
  [...list.children].forEach(li => li.classList.remove("wrong"));
}

function renumber() {
  [...list.children].forEach((li, i) => li.querySelector(".slot").textContent = i + 1);
}

function startTimer() {
  if (startTime) return;
  startTime = Date.now();
  tick = setInterval(() => timerEl.textContent = fmt(Date.now() - startTime), 1000);
}
function fmt(ms) {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function newGame() {
  solved = false;
  attempts = 0;
  attemptsEl.textContent = "0";
  clearInterval(tick); startTime = null; timerEl.textContent = "0:00";
  list.classList.remove("solved-mode");
  sortable.option("disabled", false);
  document.getElementById("check").disabled = false;
  render(shuffled(SURAHS));
}

// Keyboard support: focus an item, then use Alt+Arrow (or just Arrow keys) to move it
list.addEventListener("keydown", e => {
  const li = e.target.closest(".item");
  if (!li || solved) return;
  if (e.key.startsWith("Arrow")) clearMistakes();
  if ((e.key === "ArrowUp" || e.key === "ArrowLeft") && li.previousElementSibling) {
    e.preventDefault(); startTimer();
    list.insertBefore(li, li.previousElementSibling); renumber(); li.focus();
  } else if ((e.key === "ArrowDown" || e.key === "ArrowRight") && li.nextElementSibling) {
    e.preventDefault(); startTimer();
    list.insertBefore(li.nextElementSibling, li); renumber(); li.focus();
  }
});

const sortable = Sortable.create(list, {
  animation: 160,
  swapThreshold: 0.6,
  ghostClass: "ghost",
  chosenClass: "chosen",
  delay: 120,
  delayOnTouchOnly: true,
  scroll: true,
  scrollSensitivity: 90,
  scrollSpeed: 14,
  onStart: () => { startTimer(); clearMistakes(); },
  onSort: renumber
});

const overlay = document.getElementById("overlay");
function showModal({ kind, big, title, text, actions }) {
  const m = document.getElementById("modal");
  m.className = "modal " + kind;
  document.getElementById("mBig").textContent = big;
  document.getElementById("mTitle").textContent = title;
  document.getElementById("mText").textContent = text;
  const box = document.getElementById("mActions");
  box.innerHTML = "";
  actions.forEach(([label, fn, primary]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    if (primary) b.className = "primary";
    b.addEventListener("click", () => { overlay.hidden = true; fn(); });
    box.appendChild(b);
  });
  overlay.hidden = false;
  box.lastElementChild.focus();
}

document.getElementById("check").addEventListener("click", () => {
  startTimer();
  clearMistakes();
  attempts++;
  attemptsEl.textContent = attempts;
  const order = [...list.children].map(li => +li.dataset.n);
  const correct = order.filter((n, i) => n === 78 + i).length;

  if (correct === SURAHS.length) {
    solved = true;
    clearInterval(tick);
    const time = fmt(Date.now() - startTime);
    timerEl.textContent = time;
    list.classList.add("solved-mode");
    [...list.children].forEach(li => li.classList.add("solved"));
    sortable.option("disabled", true);
    document.getElementById("check").disabled = true;
    showModal({
      kind: "win", big: "ما شاء الله",
      title: "All 37 in the right order!",
      text: `You finished in ${time} with ${attempts} ${attempts === 1 ? "attempt" : "attempts"}.`,
      actions: [["Review list", () => {}], ["Play again", newGame, true]]
    });
  } else {
    showModal({
      kind: "lose", big: "حاول مرة أخرى",
      title: "Not quite. Try again.",
      text: `${correct} of 37 surahs are in the right place. Keep rearranging and check again.`,
      actions: [["Reshuffle", newGame], ["Show where I went wrong", showMistakes], ["Try again", () => {}, true]]
    });
  }
});

document.getElementById("shuffle").addEventListener("click", newGame);
overlay.addEventListener("click", e => { if (e.target === overlay) overlay.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") overlay.hidden = true; });

newGame();
</script>
</body>
</html>
